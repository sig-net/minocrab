[workspace]
resolver = "2"
members = [
    "crates/minocrab-zkir",
    "crates/minocrab-ir",
    "crates/minocrab-taint",
    "crates/minocrab",
    "crates/minocrab-macros",
    "crates/signet-sim",
    "crates/minocrab-std",
    # The compactc-shaped gadgets the parity ports import. Nothing in the core depends on it.
    "crates/minocrab-compat",
    "crates/minocrab-ledger",
    # Hand-written Impact, 0.0.x with no compatibility promise. Only the corpus depends on it.
    "crates/minocrab-experimental",
    "crates/minocrab-contracts",
    # The EVM ABI layer and the Signet protocol, as publishable app crates
    # (minocrab-contracts re-exports both).
    "crates/minocrab-evm",
    "crates/minocrab-signet",
    "crates/minocrab-sim",
    "crates/minocrab-bench",
    "crates/minocrab-abi",
    "crates/minocrab-interface-gen",
    # Interface crates: one per callee contract, a declaration plus its pinned artifact.
    "crates/signet-signer-interface",
    "crates/signet-responder-interface",
    "crates/xcall-target-interface",
    # The managed artifact pipeline for the Signet signer circuits (zkir/keys/expectedVk).
    "crates/signet-artifacts",
    # The Signet protocol facts the contract, the artifact pipeline and the
    # publisher all read, so mpc's graph never pulls the corpus crate.
    "crates/signet-protocol",
    # The protocol's off-circuit hashes, one definition for mpc, the publisher
    # and the contract tests, pinned against compiled-Compact vectors.
    "crates/signet-hashing",
    # The MPC publisher's pure core (build/prove/sign/seal a respond intent, no node I/O).
    "crates/minocrab-publisher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sig-net/minocrab"
# The floor is the dependencies': the pinned `midnight-*` crates are edition
# 2024, which rustc accepts from 1.85 (our own code needs 1.79).
rust-version = "1.85"

[workspace.dependencies]
# --- our own crates -------------------------------------------------------
# Path and version, because a path-only dependency cannot be published. Regular
# dependencies only: dev-dependencies stay plain `{ path = … }` so cargo strips
# them on publish, which keeps the minocrab-std ↔ minocrab-sim dev cycle open.
minocrab = { path = "crates/minocrab", version = "0.1.0" }
minocrab-abi = { path = "crates/minocrab-abi", version = "0.1.0" }
minocrab-compat = { path = "crates/minocrab-compat", version = "0.1.0" }
minocrab-evm = { path = "crates/minocrab-evm", version = "0.1.0" }
# 0.0.x on purpose: every release is breaking under Cargo's semver rules.
# The workspace_versions test holds this to the crate's own manifest.
minocrab-experimental = { path = "crates/minocrab-experimental", version = "0.0.1" }
minocrab-ir = { path = "crates/minocrab-ir", version = "0.1.0" }
minocrab-ledger = { path = "crates/minocrab-ledger", version = "0.1.0" }
minocrab-macros = { path = "crates/minocrab-macros", version = "0.1.0" }
minocrab-signet = { path = "crates/minocrab-signet", version = "0.1.0" }
minocrab-std = { path = "crates/minocrab-std", version = "0.1.0" }
minocrab-taint = { path = "crates/minocrab-taint", version = "0.1.0" }
minocrab-zkir = { path = "crates/minocrab-zkir", version = "0.1.0" }
signet-protocol = { path = "crates/signet-protocol", version = "0.1.0" }
signet-hashing = { path = "crates/signet-hashing", version = "0.1.0" }
# Versioned by the callee's wire format, not the workspace (notes/interface-crates.org).
# The workspace_versions test holds this to the crate's own manifest.
signet-signer-interface = { path = "crates/signet-signer-interface", version = "0.4.0" }
signet-responder-interface = { path = "crates/signet-responder-interface", version = "0.1.0" }

# --- upstream -------------------------------------------------------------
# Every midnight-* crate is at the version midnight-node 2.1.101 locks (ledger
# 9.1.0.1, the version the live networks run), the same set sig-net/mpc resolves.
# midnight-zkir 3.2.0 is the source the pinned compactc bundles as zkir-v3, so the
# crate and the binaries speak one ZKIR.
midnight-zkir-v3 = { version = "=3.2.0", package = "midnight-zkir" }
# zkir-v3's own dependencies, so types unify (Fr etc.).
midnight-transient-crypto = "3.0.1"
midnight-base-crypto = "1.1.1"
# The Impact VM's op set (Op::field_repr is the authority on the PI
# encoding minocrab-ledger reproduces) and the contract state model.
midnight-onchain-vm = "4.0.1"
# The tagged (de)serialization framework (ProofPreimage/key files on disk).
midnight-serialize = "1.2.1"
midnight-onchain-state = "4.0.1"
# The Impact VM's driver: QueryContext::query applies an op stream to a state;
# the verification harness runs the reference op streams through it.
midnight-onchain-runtime = "4.0.1"
# ContractAddress/TokenType, named here so the harness can spell them.
midnight-coin-structure = "3.0.1"
midnight-storage = "3.0.0"
# The zswap types and the ledger Transaction, for the burn well-formedness test
# (a dev-dependency of minocrab-contracts only).
midnight-zswap = "9.0.1"
midnight-ledger = { version = "1.0.1", package = "midnight-ledger-v9" }
# Crypto primitives zkir-v3's off-circuit interpreter uses directly (the v3
# simulator mirrors it). Versions match what the pinned midnight-* crates
# already pull in, so all types unify with midnight-zkir-v3's.
midnight-curves = "0.3.1"
group = "0.13"
sha2 = "0.11"
sha3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
proptest = "1"
# rand 0.8 to match the pinned midnight-ledger's zswap constructors (they take
# `impl Rng + CryptoRng` from rand ^0.8). Test-only.
rand = "0.8"
# The serialization format's two conformance oracles (notes/borsh-format.org),
# dev-dependencies only. `unstable__schema` exports BorshSchemaContainer.
borsh = { version = "1.6", features = ["derive", "unstable__schema"] }
# bincode 2: already in the lock via midnight-zk-stdlib, so it adds no entries.
bincode = { version = "2", features = ["serde"] }
# The ABI oracle (notes/evm-interfaces.org §7), dev-dependencies only. Exact
# pins: the version sig-net/mpc's Cargo.lock resolves, so it is the MPC's encoder.
alloy-sol-types = "=1.6.1"
alloy-primitives = "=1.6.1"

[workspace.lints.rust]
# minocrab-taint's Kani harnesses are compiled under `cargo kani` only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# `Discloses<(A, B, …)>` return types and the harnesses' scenario tuples are
# deliberately complex; byte literals keep the digit grouping of their artifact.
type_complexity = "allow"
unusual_byte_groupings = "allow"

[profile.dev]
# Full debug info dominates target/ size; line tables keep file and line in
# backtraces. Set `debug = true` locally to step through code in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies carry the field arithmetic, so they are optimized; our own
# crates stay unoptimized for fast rebuilds.
opt-level = 3
