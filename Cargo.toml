[workspace]
resolver = "2"
members = [
    "crates/minocrab-zkir",
    "crates/minocrab-ir",
    "crates/minocrab",
    "crates/minocrab-std",
    "crates/minocrab-ledger",
    "crates/minocrab-contracts",
    "crates/minocrab-sim",
    "crates/minocrab-bench",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# ZKIR v2 — Midnight's own IR definition; we re-export rather than redefine.
# Pinned to the same midnight-ledger tag the official compact flake uses for
# the zkir binaries bundled with our pinned compactc (zkir 2.2.0), so what we
# parse/emit matches the toolchain byte-for-byte. crates.io only has the older
# 2.1 (ledger-8) line — see notes/midnight-code-reuse.org.
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# zkir-v3: the ledger-9.1.0.0-rc.3 tag's copy predates the bundled zkir-v3
# binary despite identical version strings. This rev is what the official
# compact flake pins for the zkir-v3 binaries our compactc ships with.
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# Same repo+rev as midnight-zkir's own path dep, so types unify (Fr etc.).
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# The Impact VM's op set (Op::field_repr is the authority on the PI
# encoding minocrab-ledger reproduces) and the contract state model.
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# The tagged (de)serialization framework (ProofPreimage/key files on disk).
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# Crypto primitives zkir-v3's off-circuit interpreter uses directly (the v3
# simulator mirrors it). Versions match what the pinned midnight-ledger rev
# already pulls in, so all types unify with midnight-zkir-v3's.
midnight-curves = "0.3.1"
group = "0.13"
sha2 = "0.11"
sha3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
proptest = "1"

[patch.crates-io]
# midnight-zkir depends on "transient-crypto-old" ^2.2.0 (back-compat v1
# proving), which was never published to crates.io. Mirror midnight-ledger's
# own workspace patches: transient-crypto-old from its release tag, and
# serialize/base-crypto unified onto the rc.3 copies so the old and new
# transient-crypto share one set of core types.
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
