[workspace]
resolver = "2"
members = [
    "crates/minocrab-zkir",
    "crates/minocrab-ir",
    "crates/minocrab",
    "crates/minocrab-macros",
    "crates/signet-sim",
    "crates/minocrab-std",
    "crates/minocrab-ledger",
    "crates/minocrab-contracts",
    "crates/minocrab-sim",
    "crates/minocrab-bench",
    "crates/minocrab-abi",
    "crates/minocrab-interface-gen",
    # Interface crates (M12): one per callee contract, each a
    # hand-authored-or-generated declaration plus its pinned artifact.
    "crates/signet-signer-interface",
    "crates/xcall-target-interface",
    # M29 rung A/B: the managed artifact pipeline for the Signet signer
    # circuits (zkir/keys/expectedVk the MPC sidecar reads unchanged).
    "crates/signet-artifacts",
    # M30 C1: the Signet protocol facts (Misc envelope, signer circuit and
    # event names, hashVerifierKey) — the one publishable crate the contract,
    # the artifact pipeline and the publisher all read, so mpc's graph never
    # pulls the corpus crate.
    "crates/signet-protocol",
    # M30: the MPC publisher's pure core — build/prove/sign/seal a respond
    # intent, with no node I/O, for sig-net/mpc to link behind IntentClient.
    "crates/minocrab-publisher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sig-net/minocrab"
# THE FLOOR IS THE DEPENDENCIES', NOT OURS. Our own code needs 1.79 (inline
# `const { assert!(..) }` blocks — minocrab-std/src/v3.rs and the contract
# suites). Every pinned `midnight-*` crate is edition 2024 (base-crypto,
# transient-crypto, zkir, serialize, onchain-vm, storage, …), which rustc
# accepts from 1.85, so nothing here can build below that. Declaring 1.79
# would be a claim we cannot honour.
rust-version = "1.85"

[workspace.dependencies]
# --- our own crates -------------------------------------------------------
# path AND version, in one place: a path-only dependency cannot be published
# (crates.io resolves the version requirement, the path is only used for the
# local build). Regular dependencies only — DEV-dependencies deliberately stay
# plain `{ path = … }`, because cargo strips a versionless dev-dependency when
# it publishes, and that is what breaks the minocrab-std ↔ minocrab-sim dev
# cycle open for a first publish.
minocrab = { path = "crates/minocrab", version = "0.1.0" }
minocrab-abi = { path = "crates/minocrab-abi", version = "0.1.0" }
minocrab-ir = { path = "crates/minocrab-ir", version = "0.1.0" }
minocrab-ledger = { path = "crates/minocrab-ledger", version = "0.1.0" }
minocrab-macros = { path = "crates/minocrab-macros", version = "0.1.0" }
minocrab-std = { path = "crates/minocrab-std", version = "0.1.0" }
minocrab-zkir = { path = "crates/minocrab-zkir", version = "0.1.0" }
signet-protocol = { path = "crates/signet-protocol", version = "0.1.0" }

# --- upstream -------------------------------------------------------------
# ZKIR v2 — Midnight's own IR definition; we re-export rather than redefine.
# Pinned to the same midnight-ledger tag the official compact flake uses for
# the zkir binaries bundled with our pinned compactc (zkir 2.2.0), so what we
# parse/emit matches the toolchain byte-for-byte. crates.io only has the older
# 2.1 (ledger-8) line — see notes/midnight-code-reuse.org.
# zkir-v3: the ledger-9.1.0.0-rc.3 tag's copy predates the bundled zkir-v3
# binary despite identical version strings. The rev `[patch.crates-io]` pins
# below is what the official compact flake pins for the zkir-v3 binaries our
# compactc ships with.
midnight-zkir-v3 = "3.0.0-rc.2"
# zkir-v3's own dependencies, so types unify (Fr etc.).
midnight-transient-crypto = "3.0.0"
midnight-base-crypto = "1.1.0"
# The Impact VM's op set (Op::field_repr is the authority on the PI
# encoding minocrab-ledger reproduces) and the contract state model.
midnight-onchain-vm = "4.0.0"
# The tagged (de)serialization framework (ProofPreimage/key files on disk).
midnight-serialize = "1.2.0"
midnight-onchain-state = "4.0.0"
# The Impact VM's driver: QueryContext::query is the intended public entry for
# "apply this op stream to this state" (it owns the [context, effects, state]
# stack convention, the Effects encode/decode and the charged-state gas
# update). M10's verification harness executes the reference op streams
# through it rather than re-implementing any of that.
midnight-onchain-runtime = "4.0.0"
# ContractAddress/TokenType — the key types QueryContext and Effects are
# expressed in. Already in the graph via onchain-state; named here so the
# harness can spell them.
midnight-coin-structure = "3.0.0"
midnight-storage = "2.0.1"
# The zswap Offer/Input/Output types and the top-level ledger Transaction,
# used ONLY by the M10 burn well-formedness test (avenue 6): it constructs a
# transaction of the burn's exact shape and drives it through the pinned
# ledger's own `Transaction::well_formed` to prove the single claimed shielded
# spend of a user-recipient output is accepted with the receive/nullifier sets
# empty. Dev-dependency of minocrab-contracts only; nothing shipping links it.
midnight-zswap = "9.0.0"
midnight-ledger = { version = "1.0.0", package = "midnight-ledger-v9" }
# Crypto primitives zkir-v3's off-circuit interpreter uses directly (the v3
# simulator mirrors it). Versions match what the pinned midnight-ledger rev
# already pulls in, so all types unify with midnight-zkir-v3's.
midnight-curves = "0.3.1"
group = "0.13"
sha2 = "0.11"
sha3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
proptest = "1"
# rand 0.8 to match the pinned midnight-ledger's zswap constructors (they take
# `impl Rng + CryptoRng` from rand ^0.8). Test-only.
rand = "0.8"
# The two CONFORMANCE ORACLES of the serialization format (M11 stage 0,
# notes/borsh-format.org): the flat fixed little-endian layout is the one
# borsh and serde/bincode-fixint agree on, so the spec types derive both and
# the property asserts the two agree with each other and with the deployed
# bytes. `unstable__schema` is what exports BorshSchemaContainer, the source
# of the frozen offset tables. Dev-dependencies only — nothing shipping links
# either, same posture as the midnight-ledger dev-deps.
borsh = { version = "1.6", features = ["derive", "unstable__schema"] }
# bincode 2, not 1.3: 2.0.1 is ALREADY in the lock (midnight-zk-stdlib pulls
# it, with the serde feature), so the second oracle costs zero new lock
# entries, where bincode 1.3 would add a whole second major version. Its
# fixint + little-endian config is spelled out at the call site.
bincode = { version = "2", features = ["serde"] }
# THE ABI ORACLE (M38 rung D, notes/evm-interfaces.org §7): Ethereum's own
# encoder, so that `EvmCall::selector()` and `AbiType::word` are checked
# against something that is not our own arithmetic read back to itself.
# `sol!` compiles a Solidity function declaration into a `SolCall` with
# `SIGNATURE`, `SELECTOR` and `abi_encode()`.
#
# EXACT PINS (`=1.6.1`), not carets: this is a FIXTURE, and its value is
# that it is the encoder the MPC itself runs — sig-net/mpc's Cargo.lock
# resolves alloy-primitives 1.6.1 and alloy-sol-types 1.6.1. A caret would
# let the oracle drift to a version no deployment uses, silently, on any
# `cargo update`. Dev-dependencies of minocrab-contracts only; nothing
# shipping links either.
alloy-sol-types = "=1.6.1"
alloy-primitives = "=1.6.1"

[patch.crates-io]
# Every `midnight-*` dependency above is a crates.io VERSION, and this block
# points each one at the pinned rev. A downstream workspace that links
# minocrab-publisher (sig-net/mpc) applies its own
# `[patch.crates-io]` instead, so these crates share ONE copy of the ledger
# types with it rather than bringing a second one from a git source cargo
# cannot unify. Inside the rev the crates refer to each other by path, so
# patching each of them to the same rev is what keeps the graph one source.
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
midnight-ledger-v9 = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
# The ledger 9 crates also ask for the 2.x line as "transient-crypto-old"
# (midnight-onchain-state, -ledger-v9 and -zswap ^2.0.0, midnight-zkir ^2.2.0,
# for back-compat v1 proving), and 2.2.0 was never published to crates.io. So
# the ledger's own workspace patch is mirrored: transient-crypto-old from its
# release tag. Without it this workspace fails to resolve, and a graph without
# midnight-zkir (a minocrab-std consumer) silently takes crates.io 2.1.x.
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }

[workspace.lints.rust]
# minocrab-ir's Kani harnesses are compiled under `cargo kani` only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Two lints fight the tree's deliberate shapes, decided once here (M34 A,
# CONTRIBUTING.md "What an instrument MEANS when it fires"): a circuit's `Discloses<(A, B, …)>`
# return type IS its disclosure declaration, one label per published value,
# and the harnesses' scenario tuples are the same shape; and byte literals
# copied from an artifact keep the artifact's digit grouping so a reviewer
# can diff them against it.
type_complexity = "allow"
unusual_byte_groupings = "allow"

[profile.dev]
# DEBUG INFO IS THE TARGET DIRECTORY (dmd, 2026-08-16, at 36 GB). On macOS the
# dev default is `split-debuginfo = "unpacked"`, which leaves DWARF in a `.o`
# per codegen unit beside the artifact, and cargo NEVER prunes target/ — every
# fingerprint change writes a fresh generation and keeps the old one. The pile
# measured 29.8 GB across 218,997 `.o` files, against 6.6 GB of rlibs and
# 3.2 GB of test binaries. This workspace amplifies it: 29 test targets in
# minocrab-contracts alone, minocrab-std built twice (the `borsh-schema`
# feature duplicates the graph below it), and dependencies at opt-level 3.
#
# `line-tables-only` keeps what a failing test actually needs — file and line
# in every backtrace and panic — and drops the type and variable DWARF nothing
# here reads. A debugger stepping through dependency code is the thing given
# up; `debug = true` restores it locally for as long as it is wanted.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies carry the field arithmetic (midnight-ledger, transient-crypto,
# the hash chips); optimized once here, our own crates stay unoptimized with
# fast incremental rebuilds. Routine loop = plain `cargo test`; --release
# remains for the heavy gates (row_snapshot, elevated-case runs, bench).
opt-level = 3
