# The SAME patches as Cargo.toml's [patch.crates-io], at config level so
# that a cargo invocation which builds one of our crates from a scratch
# project — cargo-semver-checks does exactly that for the interface crates
# (M34 B) — resolves every midnight crate once, not twice. Keep the two
# blocks identical.
[patch.crates-io]
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "04c9c5d9bcebb8d4427d8589fb54d58a55599c14" }
