# The gate ladder (M20): the instruments run on every PR without being
# asked. What each gate MEANS when it fires is written once, in
# notes/version-bump.org's drift taxonomy — see CONTRIBUTING.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The routine loop: plain `cargo test` (deps are optimized under dev via
  # the workspace profile override), inside the nix devshell so the
  # toolchain is the pinned one.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: a red binary must not hide the ones after it — the
      # review-fixes branch found two std failures that way.
      - run: nix develop -c cargo test --workspace --no-fail-fast

  # Everything that compiles but does not run under `cargo test`: benches
  # and the binaries, plus the examples' signatures against the API. A
  # return-type change once broke minocrab-sim's cryptocost example and
  # nothing in the routine loop said so.
  check-all-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c cargo check --workspace --all-targets

  # The heavy gates: the frozen (k, rows) and interface tables, --release
  # as the testing docs prescribe.
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
      - run: >
          nix develop -c cargo test --release -p minocrab-contracts
          --test row_snapshot --test interface_snapshot

  # The Lean proofs (M25): the models under crates/minocrab-ir/lean/ (the
  # pass proofs — passes.rs embeds them via lean_proof!) and
  # crates/minocrab-std/lean/ (the numeric/visibility warrants —
  # tests/lean_claims.rs is their drift gate) must stay green — a proof
  # that stops checking is a claim that stopped being one. M27 adds
  # crates/minocrab-zkir/lean/ (the ZKIR v3 syntax + semantics): its
  # rung-1 gate is byte-exact round-trip of every v3 corpus artifact,
  # run here directly and from cargo test (tests/lean_roundtrip.rs).
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix develop -c bash -c 'cd crates/minocrab-ir/lean && lake build'
      - run: nix develop -c bash -c 'cd crates/minocrab-std/lean && lake build'
      - run: nix develop -c bash -c 'cd crates/minocrab-zkir/lean && lake build'
      - run: >
          nix develop -c bash -c
          'crates/minocrab-zkir/lean/.lake/build/bin/zkir-roundtrip corpus/zkir
          && crates/minocrab-zkir/lean/.lake/build/bin/zkir-roundtrip crates/minocrab-zkir/lean/fixtures
          && crates/minocrab-zkir/lean/.lake/build/bin/zkir-wellformed corpus/zkir'

  # The instrument the snapshots cannot replace: byte-comparison of every
  # circuit's serialized ZKIR against the PR's base. Movement is ALLOWED —
  # a legitimate change regenerates the row snapshot in the same PR — so
  # this fails only on the hidden-movement class: dumps differ while the
  # frozen tables did not move (an instruction reorder at equal rows, a
  # removed Copy — exactly what M9 phase 7 learned row_snapshot is blind
  # to). The full diff is uploaded either way.
  zkir-dump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
      - name: dump head
        run: >
          MINOCRAB_ZKIR_DUMP="$PWD/../dump-head" nix develop -c cargo test
          -p minocrab-contracts --test zkir_dump --
          --ignored dump_every_circuits_zkir
      - name: dump base
        run: |
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          MINOCRAB_ZKIR_DUMP="$PWD/../dump-base" nix develop -c cargo test \
            -p minocrab-contracts --test zkir_dump -- \
            --ignored dump_every_circuits_zkir
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
      - name: compare
        run: |
          if diff -rq ../dump-base ../dump-head > ../dump-diff.txt; then
            echo "zkir dumps byte-identical"
          else
            echo "zkir dumps moved:"
            cat ../dump-diff.txt
            mkdir -p dump-diff && cp ../dump-diff.txt dump-diff/
            for f in $(cut -d' ' -f2 ../dump-diff.txt | xargs -n1 basename 2>/dev/null | sort -u); do
              diff -u "../dump-base/$f" "../dump-head/$f" > "dump-diff/$f.diff" || true
            done
            if git diff --quiet "${{ github.event.pull_request.base.sha }}" \
                 "${{ github.event.pull_request.head.sha }}" -- \
                 crates/minocrab-contracts/tests/row_snapshot.rs; then
              echo "::error::circuits moved but the row snapshot did not —" \
                "this is the hidden-movement class (reorder at equal rows," \
                "removed Copy). Explain the movement: regenerate the" \
                "snapshot or revert the change. See CONTRIBUTING.md."
              exit 1
            fi
            echo "movement is declared (the row snapshot moved in this PR) — see the artifact"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zkir-dump-diff
          path: dump-diff/
          if-no-files-found: ignore
