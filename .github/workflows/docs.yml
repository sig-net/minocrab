# Publish the stable-tier rustdoc to GitHub Pages (M20 / M24: for a
# compiler-as-a-library the docs are the product). Not gated on crates.io.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
      - run: >
          nix develop -c cargo doc --no-deps
          -p minocrab -p minocrab-std -p minocrab-ir -p minocrab-sim
          -p minocrab-macros -p minocrab-zkir -p minocrab-abi
      - name: landing redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=minocrab_std/index.html">' \
            > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
