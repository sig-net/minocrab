[package]
name = "minocrab-bench"
# The head-to-head proving harness: it shells out to the pinned compactc and
# resolves paths against the workspace root, so it only runs in this checkout.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M6 baseline benchmark: erc20-vault + Signet singleton under MinoCrab vs compactc"

[lints]
workspace = true

[dependencies]
minocrab = { path = "../minocrab" }
minocrab-contracts = { path = "../minocrab-contracts" }
minocrab-sim = { path = "../minocrab-sim", features = ["unstable"] }
minocrab-zkir = { path = "../minocrab-zkir" }
midnight-transient-crypto.workspace = true
midnight-base-crypto.workspace = true
midnight-serialize.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
libc = "0.2"
