[package]
name = "minocrab-publisher"
# M30: the pure core of the MPC's Midnight publisher — the piece
# `sig-net/mpc`'s TypeScript sidecar exists to provide (notes/mpc-publisher.org
# §2). Since M30 C1 this crate reads the Misc envelope and the three signer
# event names from `signet-protocol` (publishable) rather than
# `minocrab-contracts` (a corpus, `publish = false`) — the ONLY remaining edge
# to that crate is a dev-dependency (tests/real_proof.rs, which keygens from
# the real circuit). So the same blocker the rest of the workspace already
# carries applies here and nowhere further: PUBLISHING.md's git-dependency
# block on the `midnight-*` line (upstream has not published the ledger-9.1
# line to crates.io yet). `publish` is left at its default (true) rather than
# pinned false, matching the other nine crates PUBLISHING.md already tracks
# as ready-when-upstream-is.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The MPC publisher's pure core: build/prove/sign/seal a Signet respond intent (M30)"
keywords = ["midnight", "signet", "mpc", "zero-knowledge"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
# The Misc envelope constants, the three signer circuit/event names, and
# `hash_verifier_key` — signet-protocol is the ONE definition of all three,
# read by the contract that emits these events and the artifact pipeline that
# hashes the keys, same as here (notes/mpc-publisher.org §11).
signet-protocol.workspace = true
midnight-base-crypto.workspace = true
midnight-coin-structure.workspace = true
midnight-ledger.workspace = true
midnight-onchain-runtime.workspace = true
midnight-onchain-state.workspace = true
midnight-onchain-vm.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-transient-crypto.workspace = true
# The v3 IR the prover interprets: `IrSource::load_ir_from_tagged` on the
# `.bzkir` beside the keys, then `ProofPreimage::prove::<IrSource>`.
midnight-zkir-v3.workspace = true
# `ProvingProvider`'s own error type is `anyhow::Error`, so implementing the
# trait needs it by name.
anyhow.workspace = true
# `Intent::new`, `Intent::sign` and `Transaction::seal` all take rand 0.8's
# `Rng`/`CryptoRng`, so the publisher's own signatures are spelled in them.
rand.workspace = true
thiserror.workspace = true
# `ManagedDir::deployment` reads the package's own `expectedVk.json` (M30 C2)
# — the same shape `signet-artifacts` writes it with.
serde_json.workspace = true

[dev-dependencies]
# The real circuit: `tests/real_proof.rs` keygens from `SignetContract::
# respond()` itself, so the gate proves under the SAME IR the corpus builds,
# not a copy of it. This is the one remaining edge to the corpus crate, and it
# is versionless (no `version =` here) precisely so a publish strips it: a
# published `minocrab-publisher` ships no test suite at all (PUBLISHING.md),
# so no downstream build ever needs this to resolve.
minocrab-contracts = { path = "../minocrab-contracts" }
# `Transaction::prove` and `IrSource::keygen` are async; the gates drive them
# on a multi-thread runtime, as the proving path does in production. `libc` is
# `getrusage(RUSAGE_SELF)` for peak RSS — the same measurement
# crates/minocrab-bench and the M29 E gate report. Declared here rather than in
# `[workspace.dependencies]` for the same reason minocrab-contracts declares
# them: test-only, and nothing shipping links them.
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"
# The fixture gate hashes the imported `.mn` files (their SHA-256 IS the
# captured transaction hash, M29 D).
sha2.workspace = true
