[package]
name = "minocrab-contracts"
# The corpus rewrite and its differential suites: a test corpus, not a
# library, and every suite reads ../../corpus and ../../spec.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sig-net corpus contracts rewritten in the MinoCrab eDSL (M4)"

[lints]
workspace = true

[dependencies]
minocrab = { path = "../minocrab" }
minocrab-std = { path = "../minocrab-std" }
minocrab-ledger = { path = "../minocrab-ledger" }
# AN IMPORTED INTERFACE CRATE (M12 stage 4): the vault calls the Signet
# singleton through the callee's own published declaration, not through a
# transliteration kept here. Ordinary cargo dependency — that is the whole
# point of the mechanism.
signet-signer-interface = { path = "../signet-signer-interface" }
# A GENERATED interface crate (M12 stage 5): nothing here implements the
# xcall target, and nothing needs to — the crate was produced from its
# compiled artifact by minocrab-interface-gen.
xcall-target-interface = { path = "../xcall-target-interface" }

[dev-dependencies]
signet-sim = { path = "../signet-sim" }
# The Borsh SCHEMA walk (M11 stage 3): `#[borsh(spec = …)]`'s generated
# cross-check calls minocrab-std's schema module, which is feature-gated so
# that only TEST builds link borsh. Resolver 2 keeps this out of the lib build.
minocrab-std = { path = "../minocrab-std", features = ["borsh-schema"] }
# The simulator is minocrab-sim's internal tier (M24): without the feature,
# `cargo test -p minocrab-contracts --test <differential>` cannot see
# `simulate` and only compiles under `--workspace` feature unification.
minocrab-sim = { path = "../minocrab-sim", features = ["unstable"] }
# The callee-side interface check (M12 stage 6): our own built IrSource
# against the schema signet-signer-interface publishes.
minocrab-abi = { path = "../minocrab-abi" }
minocrab-zkir = { path = "../minocrab-zkir" }
# The IR-pass normalisation the instruction-for-instruction differentials run
# over BOTH sides (notes/ir-passes.org §2 ii): our builder folds a `Copy` of an
# immediate at `finish`, so compactc's artifact is folded the same way before
# the comparison. One definition of the fold, used by the pass and the test.
minocrab-ir = { path = "../minocrab-ir", features = ["unstable"] }
midnight-onchain-vm.workspace = true
midnight-onchain-state.workspace = true
midnight-onchain-runtime.workspace = true
midnight-coin-structure.workspace = true
midnight-storage.workspace = true
midnight-base-crypto.workspace = true
midnight-transient-crypto.workspace = true
midnight-serialize.workspace = true
midnight-zkir-v3.workspace = true
midnight-curves.workspace = true
# The burn well-formedness test (M10 avenue 6) only: the pinned ledger's own
# Transaction::well_formed, with mock-verify so no proof server is needed.
midnight-zswap.workspace = true
midnight-ledger.workspace = true
rand.workspace = true
# The serialization-conformance suite's dual oracle (M11 stage 0): borsh and
# serde+bincode-fixint, which agree byte-for-byte on the circuit-safe subset.
# See the workspace manifest for why bincode 2.
borsh.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
proptest.workspace = true
