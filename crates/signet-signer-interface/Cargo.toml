[package]
name = "signet-signer-interface"
description = "The Sig Network signet signer's cross-contract interface, as an importable MinoCrab crate"
# PUBLISHED (dmd, 2026-11-21): minocrab-signet takes `RequestId`,
# `SignetSigner` and `construct_notification_v1` from it.
#
# NOT the workspace version: versions here are PER CALLEE (the note's "one
# crate per contract" rule — a callee that breaks its ABI must not force a
# bump on an unrelated one). 0.4 follows the signet signer at midnight-integration
# v0.26.0-rc.15, which keeps `signBidirectional` alone: `respond` and
# `respondBidirectional` moved to the signet responder (signet-responder-
# interface), with their argument types. Removing a circuit is MAJOR by the
# mechanical rule; the `signBidirectional` schema is unchanged, so no caller's
# commitment moves. tests/artifact_agreement.rs holds it to the artifact.
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "signet", "interface", "contract", "zero-knowledge"]
categories = ["cryptography::cryptocurrencies"]
# `artifact/` is the pin and the frozen wire schema the crate is held to; it
# ships as reference data (nothing in `src` reads it). `tests/` does not ship:
# the agreement suite needs `minocrab-abi`, a versionless dev-dependency that
# cargo strips on publish, and the corpus artifact under ../../corpus.
include = [
    "src/**/*.rs",
    "artifact/*.json",
    "artifact/interface-schema.txt",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lints]
workspace = true

[dependencies]
minocrab.workspace = true
minocrab-std.workspace = true
# `#[interface]`'s expansion names `::minocrab_ledger` paths (EntryPoint,
# Callee, call), so a crate that uses the attribute depends on the ledger
# layer as well as the stdlib.
minocrab-ledger.workspace = true

[dev-dependencies]
# The agreement suite ONLY: nothing shipping links the artifact checker.
minocrab-abi = { path = "../minocrab-abi" }
