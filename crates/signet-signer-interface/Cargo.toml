[package]
name = "signet-signer-interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Sig Network Signet singleton's cross-contract interface, as an importable MinoCrab crate"

[dependencies]
minocrab = { path = "../minocrab" }
minocrab-std = { path = "../minocrab-std" }
# `#[interface]`'s expansion names `::minocrab_ledger` paths (EntryPoint,
# Callee, call), so a crate that uses the attribute depends on the ledger
# layer as well as the stdlib.
minocrab-ledger = { path = "../minocrab-ledger" }

[dev-dependencies]
# The agreement suite ONLY: nothing shipping links the artifact checker.
minocrab-abi = { path = "../minocrab-abi" }
