[package]
name = "minocrab-interface-gen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generate a MinoCrab interface crate from a compactc artifact — any deployed Midnight contract becomes importable"

[[bin]]
name = "minocrab-interface-gen"
path = "src/main.rs"

[dependencies]
# The artifact model (contract-info.json, the Compact type tree) is the
# checker's; the generator reads the same parse the agreement test does, so
# the two cannot disagree about what the artifact says.
minocrab-abi = { path = "../minocrab-abi" }
serde = { workspace = true }
serde_json.workspace = true
