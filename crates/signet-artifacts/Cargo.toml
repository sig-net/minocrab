[package]
name = "signet-artifacts"
# The managed-directory pipeline for the Signet signer circuits (`.zkir`,
# `.bzkir`, keys, `expectedVk`). Nothing else depends on it.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Managed artifact pipeline (.zkir/.bzkir/keys/expectedVk) for the Signet signer and responder circuits"

[lints]
workspace = true

[dependencies]
minocrab = { path = "../minocrab" }
minocrab-contracts = { path = "../minocrab-contracts" }
minocrab-zkir = { path = "../minocrab-zkir" }
# The circuit names the files are called by, and `hash_verifier_key` — the
# function `expectedVk.json` is written with — are defined there;
# the publisher reads the same definition when it checks the table.
signet-protocol.workspace = true
# The manifest's sha256 lines.
sha2.workspace = true
serde_json.workspace = true
anyhow.workspace = true
