[package]
name = "minocrab-sim"
description = "MinoCrab L5: native ZKIR simulator with disclosure reports and row-cost metrics, so circuits run under cargo test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "zkir", "simulator", "zero-knowledge", "testing"]
categories = [
    "cryptography::cryptocurrencies",
    "simulation",
    "development-tools::testing",
]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
minocrab.workspace = true
minocrab-zkir.workspace = true
midnight-zkir.workspace = true
# v3 simulator: reuse zkir-v3's public off-circuit helpers and the same
# crypto crates its interpreter calls (see src/v3.rs).
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
midnight-base-crypto.workspace = true
midnight-curves.workspace = true
group.workspace = true
sha2.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
# v3 end-to-end tests build their circuits with the typed Builder3.
minocrab-ir = { path = "../minocrab-ir" }
# The opcost example prices minocrab-std's byte-plumbing shapes.
minocrab-std = { path = "../minocrab-std" }
