[package]
name = "minocrab-sim"
description = "MinoCrab L5: native ZKIR simulator with disclosure reports and row-cost metrics, so circuits run under cargo test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "zkir", "simulator", "zero-knowledge", "testing"]
categories = [
    "cryptography::cryptocurrencies",
    "simulation",
    "development-tools::testing",
]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# The gate-count CLI (M24): `minocrab rows|diff <file.zkir>` for people not
# using the Rust API. Reuses this crate's cost() + minocrab-zkir's read_zkir.
[[bin]]
name = "minocrab"
path = "src/bin/minocrab.rs"
# The lib crate `minocrab` owns target/doc/minocrab; the CLI has --help.
doc = false

[dependencies]
minocrab.workspace = true
minocrab-zkir.workspace = true
# The CLI's `pass` subcommand runs the published passes over a .zkir file
# (M24 point 4); a regular dependency since then, not just the tests'.
minocrab-ir = { workspace = true, features = ["unstable"] }
# v3 simulator: reuse zkir-v3's public off-circuit helpers and the same
# crypto crates its interpreter calls (see src/v3.rs).
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
midnight-base-crypto.workspace = true
midnight-curves.workspace = true
group.workspace = true
sha2.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The INTERNAL tier (M24 tier boundary, notes/library-api.org §1): the
# simulator VM (`simulate`, `Run3`, the report machinery). No stability
# promise; the stable surface is the measurement API — `cost`, `profile`,
# `assert_max_k`, `rowcost` — and the `minocrab` CLI. In-workspace crates
# enable this.
unstable = []

[dev-dependencies]
# Enable the internal tier for this crate's own tests and examples.
minocrab-sim = { path = ".", features = ["unstable"] }
anyhow.workspace = true
proptest.workspace = true
# The opcost example prices minocrab-std's byte-plumbing shapes.
minocrab-std = { path = "../minocrab-std" }
