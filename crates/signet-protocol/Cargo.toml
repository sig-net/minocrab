[package]
name = "signet-protocol"
# What the signet signer and the MPC that reads it must agree on, in a small
# publishable crate, so mpc's graph never pulls the corpus crate.
description = "The signet signer's protocol facts: the Misc envelope, the signer circuits and their event names, and compact-js's hashVerifierKey"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "signet", "mpc", "zero-knowledge"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
# `hash_verifier_key` is sha256 over the raw `.verifier` bytes and nothing
# else; the one dependency this crate has.
sha2.workspace = true
