[package]
name = "minocrab-zkir"
description = "MinoCrab L0: read, write and round-trip Midnight ZKIR (v2 and v3), reusing midnight-zkir's own types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "zkir", "zero-knowledge", "zk-snark", "bindings"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "encoding"]
# src + the round-trip fixture the unit test embeds. `tests/` proper walks
# ../../corpus, which no downstream checkout has.
include = [
    "src/**/*.rs",
    "tests/fixtures/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "lean/lakefile.toml",
    "lean/lake-manifest.json",
    "lean/MinocrabZkir.lean",
    "lean/MinocrabZkir/*.lean",
    "lean/Roundtrip.lean",
    "lean/fixtures/*.zkir",
]

[dependencies]
midnight-zkir.workspace = true
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
