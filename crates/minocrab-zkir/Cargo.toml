[package]
name = "minocrab-zkir"
description = "MinoCrab L0: read, write and round-trip Midnight ZKIR v3, reusing midnight-zkir-v3's own types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "zkir", "zero-knowledge", "zk-snark", "bindings"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "encoding"]
# src + the round-trip fixture the unit test embeds. `tests/` proper walks
# ../../corpus, which no downstream checkout has.
include = [
    "src/**/*.rs",
    "tests/fixtures/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "lean/lakefile.toml",
    "lean/lake-manifest.json",
    "lean/MinocrabZkir.lean",
    "lean/MinocrabZkir/*.lean",
    "lean/Roundtrip.lean",
    "lean/DataflowDump.lean",
    "lean/Wellformed.lean",
    "lean/fixtures/*.zkir",
    # M27 rung 4: the differential run records the `zkir-run` gate reads.
    # The artifacts they name live under corpus/ and are NOT shipped — the
    # gate skips loudly without a corpus, like the round-trip gates.
    "lean/differential/*.record",
    "lean/differential/known-answers.txt",
]

[lints]
workspace = true

[dependencies]
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
