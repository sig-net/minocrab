name = "minocrab-zkir-lean"
defaultTargets = ["MinocrabZkir", "zkir-roundtrip", "zkir-dataflow", "zkir-wellformed", "zkir-run"]

[[lean_lib]]
name = "MinocrabZkir"

# Rung 1's gate (notes/zkir-semantics.org §8): parse, print, and compare
# byte-for-byte every v3 `.zkir` under a directory.
#   lake exe zkir-roundtrip ../../../corpus/zkir
[[lean_exe]]
name = "zkir-roundtrip"
root = "Roundtrip"

# Rung 2's dump: reads/returned/defines per corpus instruction, diffed
# against the Rust functions by minocrab-ir/tests/lean_dataflow.rs.
[[lean_exe]]
name = "zkir-dataflow"
root = "DataflowDump"

# SSA well-formedness of the corpus (rung 3's precondition; the real-IR
# form of Fold.lean's WellFormed), reported per file.
[[lean_exe]]
name = "zkir-wellformed"
root = "Wellformed"

# Rung 4's gate (notes/zkir-rung4.org): evaluate a corpus artifact on a
# run record's preimage with the CONCRETE intrinsics and print the result
# block the record's expected block must equal; `--kat` reproduces the
# primitives' known-answer vectors on their own.
#   lake exe zkir-run corpus/zkir/.../startSwap.zkir differential/startSwap.record
#   lake exe zkir-run --kat differential/known-answers.txt
[[lean_exe]]
name = "zkir-run"
root = "ZkirRun"
