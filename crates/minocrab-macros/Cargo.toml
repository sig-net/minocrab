[package]
name = "minocrab-macros"
description = "The thin decorators for the MinoCrab eDSL: #[circuit], #[contract], #[interface] and the CircuitArg/CircuitBorsh/Ledger derives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "macros", "derive", "circuit", "zero-knowledge"]
categories = [
    "cryptography::cryptocurrencies",
    "development-tools::procedural-macro-helpers",
]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
# The macro crate depends on nothing of ours: it emits fully-qualified
# `::minocrab_std::v3::…` paths, so it stays a leaf of the build graph and
# cannot smuggle circuit-building code into an expansion.
proc-macro2 = "1"
quote = "1"
# "full" is what lets `#[circuit]` parse a whole `fn` (item syntax); the
# derive needs only the default features.
syn = { version = "2", features = ["full"] }
