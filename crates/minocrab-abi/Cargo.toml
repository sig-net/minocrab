[package]
name = "minocrab-abi"
description = "Artifact agreement: check a MinoCrab interface crate against the callee contract's compiled compactc artifact, as a test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "abi", "interface", "contract", "zero-knowledge"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
minocrab.workspace = true
minocrab-ledger.workspace = true
# The `.zkir` reader. compactc's v3 output is parsed through Midnight's own
# `IrSource` rather than by poking at JSON, so the constraint-prefix check
# reads the same typed instruction stream the prover does.
minocrab-zkir.workspace = true
midnight-zkir-v3.workspace = true
serde = { workspace = true }
# `raw_value` for ONE field: a Compact `Uint`'s `maxval` can be 2^128 − 1,
# which serde_json's default `Number` cannot hold (it degrades to f64 and
# loses the low bits). Deserializing that field from its RAW JSON text is
# exact. The feature is additive — it adds `RawValue`, it does not change
# how numbers are parsed anywhere else.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
minocrab-std = { path = "../minocrab-std" }
