[package]
name = "minocrab-cli"
# The gate-count CLI: measures (k, rows) over a `.zkir` file — MinoCrab's or
# compactc's — for people not using the Rust API. Region profiling stays a
# Rust-API/test feature (it needs the region-annotated Compiled3, which a
# parsed `.zkir` does not carry). Kept dependency-light on purpose.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "minocrab: a light, compiler-agnostic gate-count CLI over ZKIR files"

[[bin]]
name = "minocrab"
path = "src/main.rs"

[dependencies]
minocrab-zkir = { path = "../minocrab-zkir" }
minocrab-sim = { path = "../minocrab-sim" }
