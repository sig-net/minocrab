[package]
name = "signet-hashing"
# The Signet protocol's hashes, off circuit (request id, attested output
# hash, attestation digest): one definition for sig-net/mpc, the publisher and
# the contract tests, over the pinned ledger's own `transient_hash`.
description = "The Signet protocol's off-circuit hashes: request id, EVM type-2 transaction digest, attested output hash and attestation digest, over the ledger's own field representation"
version.workspace = true
# Not in the crates.io set (PUBLISHING.md): its consumers link it by git, and
# no published crate depends on it.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
signet-protocol.workspace = true
midnight-transient-crypto.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex = "0.4"
