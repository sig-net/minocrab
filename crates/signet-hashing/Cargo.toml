[package]
name = "signet-hashing"
# The Signet protocol's hashes, off circuit: what the MPC computes to name a
# request (the request id over its record), to attest an execution (the
# attested output hash and the attestation digest it signs), and what a
# client contract's circuits recompute. One definition for sig-net/mpc (which
# linked its own `compact-hashing` copy), for `minocrab-publisher` (which
# builds the attestation half of `respondBidirectional`) and for the tests
# that drive the contracts. Reads its domain tags and enums from
# `signet-protocol`; hashes with the pinned ledger's own `transient_hash` and
# `FieldRepr`, so it carries the `midnight-*` line and the publish guard
# PUBLISHING.md describes.
description = "The Signet protocol's off-circuit hashes: request id, EVM type-2 transaction digest, attested output hash and attestation digest, over the ledger's own field representation"
version.workspace = true
# Held until the `midnight-*` line is on crates.io at the pinned tags
# (PUBLISHING.md): the version requirements alone would resolve elsewhere.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
signet-protocol.workspace = true
midnight-transient-crypto.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex = "0.4"
